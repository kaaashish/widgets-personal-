<!DOCTYPE html>
<html>
  <head>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap');

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #f0e8d0;
       font-family: 'Dancing Script', cursive;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        border: 3px solid #d4a090;
        border-radius: 16px;
        box-shadow: 0 0 0 3px #e8c4b8, 0 8px 24px rgba(212, 160, 144, 0.3);
        -webkit-app-region: no-drag;
      }

      .titlebar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px;
        background-image: url('deerfur.jpg');
        background-size: cover;
        background-position: center;
        border-radius: 13px 13px 0 0;
        -webkit-app-region: drag;
        flex-shrink: 0;
      }

      .title { color: #fff8f5; font-size: 22px; }

      .buttons {
        display: flex;
        gap: 5px;
        -webkit-app-region: no-drag;
      }

      .btn {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
      }

      .close { background: #c87060; }
      .minimise { background: #e8c4b8; }
      .btn:hover { opacity: 0.7; }

      .deer-area {
        display: flex;
        justify-content: center;
        padding: 8px 0 4px;
        flex-shrink: 0;
      }

      .deer-img {
        height: 80px;
        width: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #e8c4b8;
        transition: opacity 0.3s;
      }

      .day-bar-area {
        padding: 6px 14px 4px;
        background: #f0e8d0;
        flex-shrink: 0;
      }

      .bar-label {
        display: flex;
        justify-content: space-between;
        color: #d4a090;
        font-size: 18px;
        margin-bottom: 4px;
      }

      .bar-container {
        width: 100%;
        height: 8px;
        background: #f0e8d0;
        border: 2px solid #d4a090;
        border-radius: 10px;
        overflow: hidden;
      }

      .day-bar {
        height: 100%;
        background: linear-gradient(90deg, #d4a090, #e8c4b8);
        border-radius: 10px;
        transition: width 1s ease;
      }

      .task-bar-area {
        padding: 4px 14px 6px;
        background: #f0e8d0;
        border-bottom: 2px dashed #e8c4b8;
        flex-shrink: 0;
      }

      .task-bar {
        height: 100%;
        background: linear-gradient(90deg, #b8806e, #d4a090);
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      .tasks {
        flex: 1;
        overflow-y: auto;
        padding: 8px 14px;
        background: #f0e8d0;
      }

      .tasks::-webkit-scrollbar { width: 4px; }
      .tasks::-webkit-scrollbar-thumb { background: #d4a090; border-radius: 2px; }
      .tasks::-webkit-scrollbar-track { background: transparent; }

      .task {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px dashed #f0e0d8;
        animation: fadein 0.3s ease;
      }

      @keyframes fadein {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .task input[type="checkbox"] {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 2px solid #d4a090;
        border-radius: 3px;
        cursor: pointer;
        flex-shrink: 0;
        background: #fdf6f0;
      }

      .task input[type="checkbox"]:checked { background: #d4a090; }

      .task input[type="checkbox"]:checked::after {
        content: '✓';
        display: block;
        text-align: center;
        color: #fff8f5;
        font-size: 10px;
        line-height: 14px;
      }

      .task-text {
        flex: 1;
        color: #7a4a3a;
        font-size: 20px;
        line-height: 1.4;
      }

      .task-text.done {
        text-decoration: line-through;
        color: #e8c4b8;
        font-style: italic;
      }

      .task-delete {
        color: #e8c4b8;
        cursor: pointer;
        font-size: 18px;
        background: none;
        border: none;
       font-family: 'Dancing Script', cursive;
      }

      .task-delete:hover { color: #c87060; }

      .empty {
        text-align: center;
        color: #e8c4b8;
        font-size: 20px;
        margin-top: 20px;
        font-style: italic;
      }

      .add-area {
        padding: 8px 14px;
        background: #f5ede8;
        border-top: 2px dashed #e8c4b8;
        border-radius: 0 0 13px 13px;
        flex-shrink: 0;
        display: flex;
        gap: 6px;
      }

      .add-area input {
        flex: 1;
        background: #fdf6f0;
        border: 1px solid #d4a090;
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 20px;
       font-family: 'Dancing Script', cursive;
        color: #7a4a3a;
        outline: none;
      }

      .add-area input::placeholder { color: #e8c4b8; font-style: italic; }
      .add-area input:focus { border-color: #b8806e; }

      .add-btn {
        background: #d4a090;
        border: none;
        border-radius: 6px;
        padding: 5px 12px;
        color: #fff8f5;
        font-size: 20px;
       font-family: 'Dancing Script', cursive;
        cursor: pointer;
      }

      .add-btn:hover { background: #b8806e; }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <span class="title">🦌 today's little list</span>
      <div class="buttons">
        <button class="btn minimise" onclick="window.electronAPI.minimize()"></button>
        <button class="btn close" onclick="window.electronAPI.close()"></button>
      </div>
    </div>

    <div class="deer-area">
      <img class="deer-img" id="deerImg" src="deer_think.jpg" />
    </div>

    <div class="day-bar-area">
      <div class="bar-label">
        <span>☀️ day progress</span>
        <span id="dayPercent">0%</span>
      </div>
      <div class="bar-container">
        <div class="day-bar" id="dayBar" style="width:0%"></div>
      </div>
    </div>

    <div class="task-bar-area">
      <div class="bar-label">
        <span>🌿 tasks done</span>
        <span id="taskPercent">0 / 0</span>
      </div>
      <div class="bar-container">
        <div class="task-bar" id="taskBar" style="width:0%"></div>
      </div>
    </div>

    <div class="tasks" id="taskList"></div>

    <div class="add-area">
      <input type="text" id="taskInput" placeholder=" " />
      <button class="add-btn" onclick="addTask()">+ add</button>
    </div>

    <script>
      let data = { tasks: [] }
      let imgTimeout = null

     const defaultImg = 'deer_think.jpg'

      function setImg(src) {
        document.getElementById('deerImg').src = src
        if (imgTimeout) clearTimeout(imgTimeout)
        if (src !== defaultImg) {
          imgTimeout = setTimeout(() => {
            document.getElementById('deerImg').src = defaultImg
          }, 2500)
        }
      }

      async function init() {
        data = await window.electronAPI.loadData()
        renderTasks()
        updateDayBar()
        setInterval(updateDayBar, 60000)
      }

      function updateDayBar() {
        const now = new Date()
        const secondsInDay = 24 * 60 * 60
        const secondsPassed = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()
        const percent = Math.floor((secondsPassed / secondsInDay) * 100)
        document.getElementById('dayBar').style.width = `${percent}%`
        document.getElementById('dayPercent').textContent = `${percent}%`
      }

      function updateTaskBar() {
        const total = data.tasks.length
        const done = data.tasks.filter(t => t.done).length
        const percent = total === 0 ? 0 : Math.floor((done / total) * 100)
        document.getElementById('taskBar').style.width = `${percent}%`
        document.getElementById('taskPercent').textContent = `${done} / ${total}`
      }

      function renderTasks() {
        const list = document.getElementById('taskList')
        list.innerHTML = ''

        if (data.tasks.length === 0) {
          list.innerHTML = '<p class="empty"🌸</p>'
          updateTaskBar()
          return
        }

        data.tasks.forEach((task, i) => {
          const div = document.createElement('div')
          div.classList.add('task')

          const check = document.createElement('input')
          check.type = 'checkbox'
          check.checked = task.done
          check.addEventListener('change', () => toggleTask(i))

          const text = document.createElement('span')
          text.classList.add('task-text')
          if (task.done) text.classList.add('done')
          text.textContent = task.text

          const del = document.createElement('button')
          del.classList.add('task-delete')
          del.textContent = '✕'
          del.addEventListener('click', () => deleteTask(i))

          div.appendChild(check)
          div.appendChild(text)
          div.appendChild(del)
          list.appendChild(div)
        })

        updateTaskBar()
      }

      async function addTask() {
        const input = document.getElementById('taskInput')
        const text = input.value.trim()
        if (!text) return
        data.tasks.push({ text, done: false })
        input.value = ''
        setImg('deer_task.jpg')
        await window.electronAPI.saveData(data)
        renderTasks()
      }

      async function toggleTask(i) {
        data.tasks[i].done = !data.tasks[i].done
        if (data.tasks[i].done) setImg('locked_in.jpg')
        await window.electronAPI.saveData(data)
        renderTasks()
      }

      async function deleteTask(i) {
        data.tasks.splice(i, 1)
        setImg('oopsy.jpg')
        await window.electronAPI.saveData(data)
        renderTasks()
      }

      document.getElementById('taskInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addTask()
      })

      init()
    </script>
  </body>
</html>
